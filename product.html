<script src="script.js"></script><script>const look=String(new URLSearchParams(location.search).get('look')||'25').padStart(2,'0');const dresses=['11','13','14','15','23'];const front=(()=>{if(look==='01')return'look-01-product-front.png';if(look==='10')return'look-10-product-front.png';if(look==='22')return'look-22-product-front.png';if(look==='23')return'look-23-product-front.png';if(Number(look)>=11&&Number(look)<=18)return dresses.includes(look)?`look-${look}-dress-front-white.png`:`look-${look}-top-front-white.png`;if(Number(look)>=2&&Number(look)<=9)return`look-${look}-top-front-white.png`;return`look-${look}-top-back-white.png`})();const isDress=dresses.includes(look);const images=[`assets/products/${front}`,`assets/details/look-${look}-${isDress?'dress':'top'}-back-white.png`,`assets/details/look-${look}-${isDress?'dress':'top'}-detail-white.png`];if(!isDress){images.push(`assets/details/look-${look}-bottom-back-white.png`,`assets/details/look-${look}-bottom-detail-white.png`)}const names={'01':['米白套装','套装','米白'],'02':['浅黄上装','上装','浅黄'],'03':['浅蓝上装','上装','浅蓝'],'04':['浅色套装','套装','米白'],'05':['蓝色上装','上装','蓝色'],'06':['蓝色套装','套装','蓝色'],'07':['蓝色上装','上装','蓝色'],'08':['粉色上装','上装','粉色'],'09':['蓝色套装','套装','蓝色'],'10':['米白套装','套装','米白'],'11':['蓝色连衣裙','连衣裙','蓝色'],'12':['蓝色上装','上装','蓝色'],'13':['米白连衣裙','连衣裙','米白'],'14':['白色连衣裙','连衣裙','白色'],'15':['浅色连衣裙','连衣裙','浅色'],'16':['粉色上装','上装','粉色'],'17':['蓝色上装','上装','蓝色'],'18':['蓝粉上装','上装','蓝粉'],'19':['蓝粉套装','套装','蓝粉'],'20':['白色上装','上装','白色'],'21':['白色套装','套装','白色'],'22':['蓝色套装','套装','蓝色'],'23':['蓝色连衣裙','连衣裙','蓝色'],'24':['白色套装','套装','白色'],'25':['蓝白条纹上装','上装','蓝白条纹']};const info=names[look]||names['25'];document.querySelector('[data-name]').textContent=info[0];document.querySelector('[data-type]').textContent='现售'+info[1];document.querySelector('[data-color]').textContent=info[2];document.querySelector('[data-gallery]').innerHTML=images.map((src,i)=>`<figure><img src="${src}" alt="${info[0]} ${i+1}"></figure>`).join('');const related=document.querySelector('[data-related]');[['01','look-01-product-front.png'],['06','look-06-top-front-white.png'],['11','look-11-dress-front-white.png'],['16','look-16-top-front-white.png']].filter(x=>x[0]!==look).forEach(x=>related.innerHTML+=`<a class="related-card" href="product.html?look=${x[0]}"><img src="assets/products/${x[1]}" alt="推荐商品"><p>查看相关商品</p></a>`)</script></body></html>
