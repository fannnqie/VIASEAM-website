<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>现售商品｜VIASEAM</title><link rel="stylesheet" href="styles.css"><style>.shop-hero{padding:155px 34px 85px;background:var(--paper)}.shop-hero h1{font-size:clamp(55px,8vw,125px);font-weight:400;line-height:.95;margin:0 0 22px}.shop-hero p:not(.eyebrow){font-size:19px;line-height:1.8;max-width:480px}.filters{position:sticky;top:62px;z-index:10;background:rgba(248,247,243,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 34px;display:flex;gap:30px;align-items:center}.filter-label{font-family:var(--sans);font-size:11px;color:var(--muted);margin-right:6px}.filter-button{font-family:var(--sans);font-size:12px;padding:0 0 5px;border-bottom:1px solid transparent}.filter-button.is-active{border-color:var(--ink)}.shop-grid{padding:60px 34px 150px;display:grid;grid-template-columns:repeat(3,1fr);gap:72px 15px}.shop-card .product-image{aspect-ratio:3/4}.shop-card h2{font-size:18px;font-weight:400;margin:18px 0 6px}.shop-card p{font-family:var(--sans);font-size:11px;color:var(--muted);margin:0 0 15px}.shop-card a{font-family:var(--sans);font-size:11px;border-bottom:1px solid currentColor;padding-bottom:5px}@media(max-width:800px){.shop-hero{padding:115px 20px 70px}.shop-hero h1{font-size:72px}.shop-hero p:not(.eyebrow){font-size:16px}.filters{top:62px;overflow-x:auto;padding:16px 20px;gap:20px;white-space:nowrap}.filter-label{display:none}.shop-grid{padding:45px 20px 100px;display:grid;grid-template-columns:1fr;gap:55px}.shop-card h2{font-size:20px}}</style></head><body>

<script src="script.js"></script><script>const products=[['01','look-01-product-front.png','米白套装','套装'],['02','look-02-top-front-white.png','浅黄上装','上装'],['03','look-03-top-front-white.png','浅蓝上装','上装'],['04','look-04-top-front-white.png','浅色套装','套装'],['05','look-05-top-front-white.png','蓝色上装','上装'],['06','look-06-top-front-white.png','蓝色套装','套装'],['07','look-07-top-front-white.png','蓝色上装','上装'],['08','look-08-top-front-white.png','粉色上装','上装'],['09','look-09-top-front-white.png','蓝色套装','套装'],['10','look-10-product-front.png','米白套装','套装'],['11','look-11-dress-front-white.png','蓝色连衣裙','连衣裙'],['12','look-12-top-front-white.png','蓝色上装','上装'],['13','look-13-dress-front-white.png','米白连衣裙','连衣裙'],['14','look-14-dress-front-white.png','白色连衣裙','连衣裙'],['15','look-15-dress-front-white.png','浅色连衣裙','连衣裙'],['16','look-16-top-front-white.png','粉色上装','上装'],['17','look-17-top-front-white.png','蓝色上装','上装'],['18','look-18-top-front-white.png','蓝粉上装','上装'],['19','look-19-top-back-white.png','蓝粉套装','套装'],['20','look-20-top-back-white.png','白色上装','上装'],['21','look-21-top-back-white.png','白色套装','套装'],['22','look-22-product-front.png','蓝色套装','套装'],['23','look-23-product-front.png','蓝色连衣裙','连衣裙'],['24','look-24-top-back-white.png','白色套装','套装'],['25','look-25-top-back-white.png','蓝白条纹上装','上装']];const grid=document.querySelector('[data-shop-grid]');function render(filter='all'){grid.innerHTML=products.filter(p=>filter==='all'||p[3]===filter).map(p=>`<article class="shop-card reveal" data-cat="${p[3]}"><div class="product-image"><img src="assets/products/${p[1]}" alt="${p[2]}"></div><h2>${p[2]}</h2><p>现售${p[3]}</p><a href="#unavailable">查看详情</a></article>`).join('');document.querySelectorAll('.reveal').forEach(e=>e.classList.add('is-visible'))}render();document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('is-active'));b.classList.add('is-active');render(b.dataset.filter)}));</script></body
